name: Helium
options:
  bundleIdPrefix: computer.helium.community
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  HeliumCore:
    type: framework
    platform: iOS
    sources:
      - path: Core/Sources/HeliumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.helium.community.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  Helium:
    type: application
    platform: iOS
    sources:
      - path: HeliumApp
    dependencies:
      - target: HeliumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.helium.community.browser
        PRODUCT_NAME: Helium
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - HeliumTests
  HeliumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Core/Tests/HeliumCoreTests
    dependencies:
      - target: HeliumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: computer.helium.community.browser.tests
        GENERATE_INFOPLIST_FILE: YES
